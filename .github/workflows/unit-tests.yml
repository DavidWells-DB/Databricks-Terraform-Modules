name: Unit tests (fmt / validate / plan-test)

# Credential-free gate that runs on every push and PR. Enforces the cheap half of
# quality gates for every module:
#   - terraform fmt -check   (formatted)
#   - terraform validate     (config is internally consistent)
#   - terraform test         (tests/plan.tftest.hcl — mock_provider, command = plan)
#
# IMPORTANT: modules declare `configuration_aliases` and have no provider block of their
# own, so `terraform validate` at the module ROOT fails ("provider configuration not
# present"). Validation runs through examples/basic, which supplies a concrete provider
# block — the example IS the fixture (Rule 4.4). fmt and plan-tests run at the module root.
#
# The apply-command integration tests (tests/integration.tftest.hcl) need real
# credentials and provision real cloud infrastructure, so they are NOT run in CI.
# Run them locally against a test account with `terraform test`.
#
# Module directories are discovered dynamically, so new modules are covered the moment
# they land — no workflow edit required. Test fixtures under tests/ are excluded.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 0" # weekly (Sun 06:00 UTC): catch provider drift with no cloud creds

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - name: Find module directories
        id: find
        # A module dir is any directory with a versions.tf that is NOT under examples/ or
        # tests/ (the latter excludes test fixtures like aws-uc-storage-credential's
        # tests/fixtures/s3-bucket). Emitted as a JSON array for the matrix.
        run: |
          modules=$(find . -name versions.tf \
              -not -path '*/examples/*' \
              -not -path '*/tests/*' \
              -not -path './.git/*' \
            | sed 's|/versions.tf$||' | sed 's|^\./||' | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"
          echo "Discovered modules:"
          echo "${modules}" | jq -r '.[]'

  unit:
    name: ${{ matrix.module }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: fmt -check
        working-directory: ${{ matrix.module }}
        run: terraform fmt -check -recursive

      - name: validate (via examples/basic)
        working-directory: ${{ matrix.module }}
        # Module roots use configuration_aliases and have no provider block, so validate
        # must run where a concrete provider exists: examples/basic.
        run: |
          if [ -d examples/basic ]; then
            cd examples/basic
            terraform init -backend=false
            terraform validate
          else
            echo "No examples/basic — skipping validate (every module is expected to ship one, Rule 4.4)."
          fi

      - name: plan-tests
        working-directory: ${{ matrix.module }}
        # Plan tests use mock_provider and run at the module root (no credentials).
        run: |
          terraform init -backend=false
          if [ -f tests/plan.tftest.hcl ]; then
            terraform test -filter=tests/plan.tftest.hcl
          else
            echo "No tests/plan.tftest.hcl — skipping (plan tests are expected per Rule 4.3)."
          fi

  # Static analysis (the verify checklist's mandated gates): tflint for config
  # hygiene and tfsec for security findings, across every module + its examples.
  static-analysis:
    name: tflint + tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install tflint + tfsec
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/main/install_linux.sh | bash
          curl -sSL https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 \
            -o /usr/local/bin/tfsec && chmod +x /usr/local/bin/tfsec
      - name: tflint (recursive, no plugins)
        run: tflint --recursive --chdir=.
      - name: tfsec
        run: tfsec --no-guide 2>/dev/null || tfsec
