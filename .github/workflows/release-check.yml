name: Release tag check

# Runs on every tag push matching the monorepo pattern <module>/vX.Y.Z.
# Enforces two rules from docs/RELEASING.md:
#   1. The pushed tag must have a matching ## [X.Y.Z] entry in the module's CHANGELOG.md.
#   2. The push event must represent tag creation, not a force-move.
#
# GitHub tag rulesets are the preventive guard (Settings → Rules → Rulesets →
# New tag ruleset → Restrict updates + Restrict deletions for all tags). The
# event check below is a secondary audit: by the time a tag push workflow runs,
# the remote ref already contains the pushed value, so comparing it to origin
# cannot detect a force-move.

on:
  push:
    tags:
      - '**/v[0-9]*.[0-9]*.[0-9]*' # matches module paths at any depth

permissions:
  contents: read

jobs:
  release-check:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Extract module (everything before the last /vX.Y.Z)
          MODULE="${TAG%/v*}"
          echo "module=${MODULE}" >> "$GITHUB_OUTPUT"

      - name: Check CHANGELOG entry matches tag version
        run: |
          bash scripts/check-release-tag.sh "${{ steps.tag.outputs.tag }}"

      - name: Check tag is not a force-move
        env:
          TAG_CREATED: ${{ github.event.created }}
          TAG_FORCED: ${{ github.event.forced }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [[ "$TAG_CREATED" != "true" || "$TAG_FORCED" == "true" ]]; then
            echo "ERROR: Tag '${TAG}' was updated instead of created." >&2
            echo "       Published tags are immutable; cut a new version instead." >&2
            exit 3
          fi
          echo "OK: Tag '${TAG}' was created by this push event."
